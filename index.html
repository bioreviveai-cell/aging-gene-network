<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aging Gene Network</title>
  <link rel="stylesheet" href="style.css" />

  <!-- vis-network for graph rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/vis-network.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/vis-network.min.css" />
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="4"  r="2.5" fill="currentColor" opacity="0.9"/>
          <circle cx="4"  cy="14" r="2.5" fill="currentColor" opacity="0.7"/>
          <circle cx="18" cy="14" r="2.5" fill="currentColor" opacity="0.7"/>
          <circle cx="11" cy="11" r="1.8" fill="currentColor"/>
          <line x1="11" y1="6.5" x2="11" y2="9.2"  stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
          <line x1="6"  y1="13"  x2="9.2" y2="11.5" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
          <line x1="16" y1="13"  x2="12.8" y2="11.5" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
        </svg>
        <span>Aging Gene Network</span>
      </div>
      <div class="header-meta">
        <span id="gene-count-badge" class="badge hidden">— genes</span>
        <a href="https://open-genes.com" target="_blank" rel="noopener" class="source-link">Open Genes ↗</a>
      </div>
    </div>
  </header>

  <!-- ═══ CONTROLS BAR ═══ -->
  <div class="controls-bar">
    <div class="controls-inner">

      <!-- Hallmark filter -->
      <div class="control-group">
        <label class="control-label">Aging hallmark</label>
        <select id="hallmark-select">
          <option value="">All hallmarks</option>
        </select>
      </div>

      <!-- Confidence filter -->
      <div class="control-group">
        <label class="control-label">Min. criteria met</label>
        <select id="criteria-select">
          <option value="1">≥ 1</option>
          <option value="2">≥ 2</option>
          <option value="3" selected>≥ 3</option>
          <option value="5">≥ 5</option>
          <option value="8">≥ 8</option>
        </select>
      </div>

      <!-- Lifespan effect filter -->
      <div class="control-group">
        <label class="control-label">Lifespan effect</label>
        <select id="effect-select">
          <option value="">Any</option>
          <option value="increases">Increases lifespan</option>
          <option value="decreases">Decreases lifespan</option>
        </select>
      </div>

      <!-- Gene limit -->
      <div class="control-group">
        <label class="control-label">Show top</label>
        <select id="limit-select">
          <option value="40">40 genes</option>
          <option value="80" selected>80 genes</option>
          <option value="150">150 genes</option>
          <option value="300">300 genes</option>
        </select>
      </div>

      <button id="fetch-btn" class="btn-primary">Load network</button>
    </div>
  </div>

  <!-- ═══ MAIN LAYOUT ═══ -->
  <main>
    <!-- Graph canvas -->
    <div id="graph-wrap">
      <div id="network"></div>

      <!-- Empty / loading state -->
      <div id="graph-state" class="graph-state">
        <div class="state-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" opacity="0.35">
            <circle cx="24" cy="10" r="5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="34" r="5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="38" cy="34" r="5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="3" fill="currentColor" opacity="0.5"/>
            <line x1="24" y1="15" x2="24" y2="21" stroke="currentColor" stroke-width="1.2"/>
            <line x1="14" y1="31" x2="21" y2="25" stroke="currentColor" stroke-width="1.2"/>
            <line x1="34" y1="31" x2="27" y2="25" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </div>
        <p id="state-message">Choose filters and click <strong>Load network</strong></p>
        <p id="state-sub" class="state-sub">Genes are fetched live from the Open Genes API</p>
      </div>
    </div>

    <!-- Gene detail panel -->
    <aside id="detail-panel" class="detail-panel closed">
      <button id="panel-close" class="panel-close" aria-label="Close">✕</button>
      <div id="panel-content"></div>
    </aside>
  </main>

  <!-- ═══ STATS BAR ═══ -->
  <div id="stats-bar" class="stats-bar hidden">
    <span id="stat-nodes"></span>
    <span class="stat-sep">·</span>
    <span id="stat-edges"></span>
    <span class="stat-sep">·</span>
    <span id="stat-top-hub"></span>
    <span class="stat-sep">·</span>
    <span id="stat-source">Source: Open Genes API (open-genes.com)</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
