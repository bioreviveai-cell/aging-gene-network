[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Allow the Open Genes API and CDN resources
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
